<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forma Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F4F5F6; --surface:#FFFFFF; --surface-2:#EEF0F2; --surface-3:#E4E7EA;
  --ink:#111418; --ink-2:#2B3137; --muted:#5B636B; --line:#DDE1E5; --line-2:#EEF0F2;
  --accent:#C2410C; --accent-hover:#9A3412; --accent-ink:#FFFFFF; --accent-soft:#FFF4ED; --accent-soft-ink:#9A3412;
  --side:#1B1F23; --side-2:#2A3036; --side-ink:#BAC2CA; --side-ink-strong:#FFFFFF; --side-line:#30363C; --side-field:#22272C; --signal:#F97316;
  --s0:#8B949E; --s1:#2F5F8A; --s2:#C2410C; --s3:#15803D; --s4:#111418;
  --good:#15803D; --good-soft:#E7F4EC; --info-soft:#EAF1F8; --info-ink:#244C70;
  --focus:#2F5F8A; --scrim:rgba(17,20,24,.48); --shadow:0 12px 40px rgba(17,20,24,.18);
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111417; --surface:#191D21; --surface-2:#22272C; --surface-3:#2B3137;
    --ink:#E8EBEE; --ink-2:#C9CFD5; --muted:#9AA3AD; --line:#2C3238; --line-2:#242A2F;
    --accent:#F07A2E; --accent-hover:#F59451; --accent-ink:#111418; --accent-soft:#3A2418; --accent-soft-ink:#FDBA8C;
    --side:#0C0E10; --side-2:#1D2226; --side-line:#23282D; --side-field:#15191C;
    --s0:#8B949E; --s1:#6CA0D6; --s2:#F07A2E; --s3:#3FB26B; --s4:#E8EBEE;
    --good:#3FB26B; --good-soft:#18301F; --info-soft:#1A2733; --info-ink:#9CC3E8; --focus:#6CA0D6; --scrim:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111417; --surface:#191D21; --surface-2:#22272C; --surface-3:#2B3137;
  --ink:#E8EBEE; --ink-2:#C9CFD5; --muted:#9AA3AD; --line:#2C3238; --line-2:#242A2F;
  --accent:#F07A2E; --accent-hover:#F59451; --accent-ink:#111418; --accent-soft:#3A2418; --accent-soft-ink:#FDBA8C;
  --side:#0C0E10; --side-2:#1D2226; --side-line:#23282D; --side-field:#15191C;
  --s0:#8B949E; --s1:#6CA0D6; --s2:#F07A2E; --s3:#3FB26B; --s4:#E8EBEE;
  --good:#3FB26B; --good-soft:#18301F; --info-soft:#1A2733; --info-ink:#9CC3E8; --focus:#6CA0D6; --scrim:rgba(0,0,0,.6);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
.mono{font-family:var(--mono)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
svg.i{width:18px;height:18px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:square;stroke-linejoin:miter}

/* Shell */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%;background:linear-gradient(to right,var(--side) 240px,transparent 240px)}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;gap:24px;padding:20px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:12px;padding:0 10px;color:var(--side-ink-strong);font-weight:600;font-size:19px;letter-spacing:3.5px}
.brand svg{width:30px;height:30px;flex-shrink:0}
.area{display:flex;flex-direction:column;gap:6px;padding:0 10px}
.area label{font-family:var(--mono);font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:#8F98A1}
.area select{height:40px;border-radius:2px;border:1px solid #3A4148;background:var(--side-field);color:#fff;padding:0 10px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;height:42px;padding:0 12px;border:0;border-radius:2px;background:transparent;color:var(--side-ink);font-size:14px;font-weight:500;text-align:left;width:100%}
.nav button:hover{background:rgba(255,255,255,.05);color:#fff}
.nav button[aria-current="page"]{background:var(--side-2);color:#fff;box-shadow:inset 3px 0 0 var(--signal)}
.nav .count{margin-left:auto;font-family:var(--mono);font-size:11px;background:var(--signal);color:#111418;border-radius:2px;padding:1px 6px}
.nav-foot{margin-top:auto;border-top:1px solid var(--side-line);padding-top:12px}
.nav-foot button{font-size:13px;height:40px}
.main{display:flex;flex-direction:column;min-width:0}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 32px;background:var(--surface);border-bottom:1px solid var(--line)}
.crumb{font-family:var(--mono);font-size:12px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.crumb b{color:var(--ink);font-weight:500}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.search{display:flex;align-items:center;gap:8px;width:280px;height:40px;padding:0 12px;border:1px solid var(--line);border-radius:2px;background:var(--surface-2);color:var(--muted)}
.search input{border:0;outline:0;background:transparent;width:100%;font-size:13px;color:var(--ink)}
.search:focus-within{border-color:var(--focus)}
.role{display:flex;align-items:center;gap:8px}
.role select,.select{height:40px;border:1px solid var(--line);border-radius:2px;background:var(--surface);padding:0 10px;font-size:13px}
.demo-tag{font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);border:1px dashed var(--line);padding:3px 6px;border-radius:2px;white-space:nowrap}
.avatar{width:40px;height:40px;border-radius:2px;background:var(--side);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:13px;font-weight:500;flex-shrink:0}
.top .menu-btn{display:none}
.scrim{display:none}
.content{padding:28px 32px 56px;display:flex;flex-direction:column;gap:24px;min-width:0}

/* Headings */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-head h1{font-size:30px;font-weight:600;letter-spacing:-.6px;line-height:1.15}
.page-head .sub{color:var(--muted);margin-top:6px;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
h2.sec{font-size:18px;font-weight:600;letter-spacing:-.2px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:2px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-size:14px;font-weight:600;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover:not(:disabled){background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.secondary{background:var(--surface);color:var(--ink);border-color:var(--ink)}
.btn.secondary:hover:not(:disabled){background:var(--surface-2);border-color:var(--ink)}
.btn.quiet{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.quiet:hover:not(:disabled){background:var(--surface-2);border-color:var(--line)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn svg.i{width:16px;height:16px;stroke-width:2}
.link{border:0;background:none;padding:6px 0;color:var(--accent);font-weight:600;display:inline-flex;align-items:center;gap:6px;font-size:13px}
.link:hover{color:var(--accent-hover);text-decoration:underline}
.iconbtn{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border:1px solid transparent;border-radius:2px;background:transparent;color:var(--muted)}
.iconbtn:hover:not(:disabled){background:var(--surface-2);color:var(--ink)}

/* Metrics */
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.metric{background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:14px 18px;display:flex;flex-direction:column;gap:6px}
.metric b{font-family:var(--mono);font-weight:500;font-size:26px;letter-spacing:-.8px;font-variant-numeric:tabular-nums}

/* Board */
.board-wrap{overflow-x:auto;padding-bottom:6px}
.board{display:grid;grid-template-columns:repeat(var(--cols),minmax(250px,1fr));gap:12px}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.col-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 2px 8px;border-bottom:2px solid var(--tone)}
.col-head .label{color:var(--ink);display:flex;align-items:center;gap:8px}
.sq{width:8px;height:8px;background:var(--tone);display:inline-block;flex-shrink:0}
.card{display:flex;flex-direction:column;gap:4px;text-align:left;width:100%;padding:14px 14px 12px;border:1px solid var(--line);border-radius:2px;background:var(--surface);transition:border-color .12s,box-shadow .12s}
.card:hover{border-color:var(--ink);box-shadow:0 2px 0 var(--line)}
.card.flag{border-color:var(--accent)}
.card-t{font-size:14px;font-weight:600;line-height:1.35}
.card-c{font-size:12px;color:var(--muted)}
.card-v{font-family:var(--mono);font-weight:500;font-size:20px;letter-spacing:-.5px;margin-top:8px;font-variant-numeric:tabular-nums}
.card-f{display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding-top:10px;border-top:1px solid var(--line-2);width:100%}
.ini{width:26px;height:26px;border-radius:2px;background:var(--surface-2);font-family:var(--mono);font-size:11px;font-weight:500;display:inline-flex;align-items:center;justify-content:center}
.card-note{margin-top:6px;padding:8px 10px;background:var(--accent-soft);color:var(--accent-soft-ink);font-size:12px;line-height:1.5;width:100%}
.card-note.info{background:var(--info-soft);color:var(--info-ink)}
.empty-col{font-size:12px;color:var(--muted);padding:14px 4px;text-align:center;border:1px dashed var(--line);border-radius:2px}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.5px;text-transform:uppercase;padding:3px 8px;border-radius:2px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill .sq{width:7px;height:7px}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--accent-soft);color:var(--accent-soft-ink)}
.pill.info{background:var(--info-soft);color:var(--info-ink)}

/* Panels, lists, tables */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel.soft{background:var(--surface-2);border-color:transparent}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:2px}
.row{display:flex;align-items:center;gap:16px;padding:14px 18px;border-top:1px solid var(--line-2);flex-wrap:wrap}
.row:first-child{border-top:0}
.row .grow{flex:1 1 220px;min-width:0}
.row h3{font-size:14px;font-weight:600}
button.row{width:100%;text-align:left;border-left:0;border-right:0;border-bottom:0;background:transparent}
button.row:first-child{border-top:0}
button.row:hover{background:var(--surface-2)}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.two{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:24px;align-items:start}
.two.even{grid-template-columns:repeat(2,minmax(0,1fr))}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.facts div{display:flex;flex-direction:column;gap:4px}
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:2px}
table.data{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.data th{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
table.data td{padding:10px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
table.data tr:last-child td{border-bottom:0}
table.data td.r,table.data th.r{text-align:right}
table.data.quote{min-width:620px}
table.data.quote td:first-child{min-width:190px}
table.data input{width:88px;height:36px;border:1px solid var(--line);border-radius:2px;background:var(--surface);padding:0 8px;font-family:var(--mono);text-align:right}
table.data input:disabled{background:transparent;border-color:transparent}
.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:2px;background:var(--info-soft);color:var(--info-ink);font-size:13px;line-height:1.5}
.notice.warn{background:var(--accent-soft);color:var(--accent-soft-ink)}
.notice.good{background:var(--good-soft);color:var(--good)}
.notice svg.i{margin-top:1px}

/* Tabs */
.back{align-self:flex-start}
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:12px 0 14px;font-size:14px;font-weight:500;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* Journey */
.journey{display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:24px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.step:first-child{border-top:0}
.step .dot{width:14px;height:14px;border:2px solid var(--s0);border-radius:50%;justify-self:center}
.step.done .dot{background:var(--good);border-color:var(--good)}
.step.now .dot{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}

/* Approvals */
.appr{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:16px;align-items:center;padding:18px 20px;border-top:1px solid var(--line-2)}
.appr:first-child{border-top:0}
.appr .mark{width:40px;height:40px;border-radius:2px;display:flex;align-items:center;justify-content:center;background:var(--surface-2);color:var(--muted)}
.appr .mark.ok{background:var(--good-soft);color:var(--good)}
.appr .mark.now{background:var(--accent-soft);color:var(--accent-soft-ink)}

/* Forms */
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500}
.field input:not([type=checkbox]):not([type=file]):not([type=color]),.field select,.field textarea{height:42px;border:1px solid var(--line);border-radius:2px;background:var(--surface);padding:0 12px;font-size:14px;font-weight:400;width:100%}
.field textarea{height:auto;min-height:104px;padding:10px 12px;resize:vertical;line-height:1.5}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--focus);outline-offset:0;border-color:var(--focus)}
.field input:disabled,.field textarea:disabled{background:var(--surface-2);color:var(--muted)}
.field input[type=color]{width:64px;height:42px;border:1px solid var(--line);border-radius:2px;padding:2px;background:var(--surface)}
.field input[type=file]{font-size:13px}
.hint{font-size:12px;font-weight:400;color:var(--muted)}
.check{display:flex;align-items:center;gap:10px;font-size:14px;min-height:44px}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.form{display:flex;flex-direction:column;gap:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.switch-row{display:flex;align-items:center;justify-content:space-between;min-height:44px;border-top:1px solid var(--line-2)}
.switch-row:first-of-type{border-top:0}
.switch-row input{width:18px;height:18px;accent-color:var(--accent)}

/* Modal */
.overlay{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:60;overflow-y:auto}
.modal{position:relative;width:min(560px,100%);background:var(--surface);border-radius:2px;box-shadow:var(--shadow);padding:28px;display:flex;flex-direction:column;gap:18px}
.modal.wide{width:min(900px,100%)}
.modal h2{font-size:20px;font-weight:600;letter-spacing:-.3px;padding-right:40px}
.modal .x{position:absolute;top:16px;right:16px}
.cat-add{display:grid;grid-template-columns:minmax(0,1fr) 90px auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line-2)}
.cat-add input{height:40px;border:1px solid var(--line);border-radius:2px;padding:0 8px;font-family:var(--mono);background:var(--surface)}

/* Document preview */
.paper-wrap{background:var(--surface-3);padding:24px;border-radius:2px;overflow-x:auto}
.paper{background:#fff;color:#1b1f23;max-width:720px;margin:0 auto;padding:48px;font-family:var(--sans);font-size:13px;line-height:1.55;box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* Empty */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:48px 20px;background:var(--surface);border:1px dashed var(--line);border-radius:2px}
.empty svg.i{width:36px;height:36px;color:var(--muted);stroke-width:1.3}
.empty h2{font-size:17px;font-weight:600}
.empty p{color:var(--muted);max-width:44ch}

/* Audit */
.event{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;padding:14px 18px;border-top:1px solid var(--line-2);align-items:start}
.event:first-child{border-top:0}
.event .when{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.event .delta{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:2px;word-break:break-word}

/* Reports */
.bar-row{display:grid;grid-template-columns:170px minmax(0,1fr) 110px 40px;gap:14px;align-items:center;padding:10px 0;border-top:1px solid var(--line-2)}
.bar-row:first-child{border-top:0}
.bar{height:14px;background:var(--surface-2);position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--tone)}

/* Gantt */
.gantt{display:flex;flex-direction:column;gap:6px}
.g-row{display:grid;grid-template-columns:200px minmax(0,1fr);gap:12px;align-items:center;font-size:13px}
.g-track{position:relative;height:22px;background:var(--surface-2)}
.g-bar{position:absolute;top:4px;bottom:4px;background:var(--s1)}
.g-bar.done{background:var(--good)}
.g-ms{position:absolute;top:3px;width:16px;height:16px;background:var(--accent);transform:translateX(-8px) rotate(45deg)}
.g-scale{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:212px}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--side);color:#fff;padding:12px 16px;border-radius:2px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow);z-index:80;font-size:13px;max-width:calc(100% - 32px)}
.toast svg.i{color:var(--signal)}

/* Login */
.login{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.login-art{background:var(--side);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;gap:32px}
.login-art .brand{padding:0}
.login-art h1{font-size:34px;font-weight:600;letter-spacing:-.8px;line-height:1.2;max-width:18ch}
.login-art p{color:var(--side-ink);max-width:44ch}
.login-form{display:flex;align-items:center;justify-content:center;padding:48px 24px;background:var(--bg)}
.login-form .form{width:min(380px,100%)}
.login-form h2{font-size:24px;font-weight:600;letter-spacing:-.4px}

@media (max-width:1100px){
  .metrics{grid-template-columns:repeat(2,minmax(0,1fr))}

const xml = s => String(s).replace(/[<>&"']/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&apos;'}[c]));
async function docxFor(d){
  try { await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js'); }
  catch(e){ toast('The Word export tool could not load. Check your connection and try again.'); return; }
  const P = (t, o={}) => `<w:p>${o.style?`<w:pPr><w:pStyle w:val="${o.style}"/>${o.right?'<w:jc w:val="right"/>':''}</w:pPr>`:o.right?'<w:pPr><w:jc w:val="right"/></w:pPr>':''}<w:r>${o.bold||o.size||o.color?`<w:rPr>${o.bold?'<w:b/>':''}${o.color?`<w:color w:val="${o.color}"/>`:''}${o.size?`<w:sz w:val="${o.size}"/>`:''}</w:rPr>`:''}<w:t xml:space="preserve">${xml(t)}</w:t></w:r></w:p>`;
  const cell = (t, right, bold) => `<w:tc><w:tcPr><w:tcW w:w="0" w:type="auto"/></w:tcPr>${P(t,{right,bold})}</w:tc>`;
  const color = (d.theme||'#1B1F23').replace('#','');
  const rows = [`<w:tr>${cell('Description',false,true)}${cell('Qty',true,true)}${cell('Unit price',true,true)}${cell('Total',true,true)}</w:tr>`]
    .concat(d.lines.map(l=>`<w:tr>${cell(l.name)}${cell(String(l.qty),true)}${cell(money(l.price),true)}${cell(money(l.qty*l.price),true)}</w:tr>`)).join('');
  const body = [P('FORMA',{bold:true,color}), P(d.contact), P(`${d.ref} · Revision ${d.rev} · ${d.date}`), d.status!=='Approved'?P('DRAFT · NOT FOR SIGNATURE',{bold:true,color:'9A3412'}):'',
    P(d.template,{color:'5B636B'}), P(d.name,{bold:true,size:40,color}), P('Prepared for ' + d.client), P(d.narrative || 'Supply, installation and commissioning as detailed below.'),
    `<w:tbl><w:tblPr><w:tblW w:w="5000" w:type="pct"/><w:tblBorders><w:bottom w:val="single" w:sz="4" w:color="DDE1E5"/><w:insideH w:val="single" w:sz="4" w:color="DDE1E5"/></w:tblBorders></w:tblPr>${rows}</w:tbl>`,
    P('Subtotal ' + money(d.lines.reduce((a,l)=>a+l.qty*l.price,0)),{right:true}), d.discount?P('Discount ' + d.discount + '%',{right:true}):'',
    P('Total ' + money(docTotal(d)),{right:true,bold:true,size:28,color}), P('Excluding VAT · Valid for 30 days',{right:true}), P(''), P(d.footer,{color:'5B636B'})].join('');
  const zip = new window.JSZip();
  zip.file('[Content_Types].xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>');
  zip.file('_rels/.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
  zip.file('word/document.xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${body}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134" w:header="0" w:footer="0" w:gutter="0"/></w:sectPr></w:body></w:document>`);
  const blob = await zip.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
  await saveFile(`Quotation-${d.ref}-v${d.rev}.docx`, blob);
}

function vProjects(){
  const list = filtered();
  const cols = inArea().some(p=>p.stage===4) ? 5 : 4;
  const pipeline = list.reduce((a,p)=>a+p.value,0);
  const sumStage = i => list.filter(p=>p.stage===i).reduce((a,p)=>a+p.value,0);
  const metric = (l,v) => `<div class="metric"><span class="label">${l}</span><b>${v}</b></div>`;
  const note = p => {
    if(p.stage===2) return `<span class="card-note">${p.approval==='Technical' ? 'Technical review pending, commercial follows.' : 'Commercial approval pending.'}</span>`;
    if(p.stage===1 && p.rejection) return `<span class="card-note">Changes requested: ${esc(p.rejection)}</span>`;
    if(p.stage===3 && p.signed && !p.counter) return `<span class="card-note info">Customer signed. Countersignature pending.</span>`;
    return '';
  };
  const board = STAGES.slice(0, cols).map((st,i) => {
    const items = list.filter(p=>p.stage===i);
    return `<section class="col" style="--tone:${toneVar(i)}" aria-label="${esc(st)}">
      <div class="col-head"><span class="label"><span class="sq"></span>${esc(st)} <span class="muted">${items.length}</span></span><span class="label">${money(sumStage(i))}</span></div>
      ${items.map(p=>`<button type="button" class="card ${p.stage===2?'flag':''}" data-act="open" data-id="${p.id}">

        <span class="card-v">${money(p.value)}</span>
        <span class="card-f"><span class="ini" title="Owner">${esc(p.owner)}</span><span class="label">Due ${fmtDate(p.due)}</span></span>${note(p)}</button>`).join('') || `<p class="empty-col">${U.q ? 'No matches at this stage' : 'No projects at this stage'}</p>`}
    </section>`;
  }).join('');
  return pageHead('Commercial pipeline', 'Every live quote from intake to signature', btn('Export','exportCsv',{cls:'secondary',icon:'down'}) + btn('New project','newProject',{icon:'plus'}))
    + `<div class="metrics">${metric('Active projects', list.length)}${metric('Pipeline value', money(pipeline))}${metric('In approval', money(sumStage(2)))}${metric('Awaiting signature', money(sumStage(3)))}</div>`
    + (inArea().length ? `<div class="board-wrap"><div class="board" style="--cols:${cols}">${board}</div></div>` : emptyBox('folder','No projects in this area yet','Create the first project to start the pipeline for '+U.area+'.', btn('New project','newProject',{icon:'plus'})));
}

function vPlanning(){
  const list = filtered().filter(p=>p.stage===4);
  if(!list.length) return pageHead('Planning','Tasks, milestones and dependencies ' + phase2) + emptyBox('calendar','No orders in delivery yet','Complete both signatures and hand a project over to start planning its delivery.', btn('Go to projects','nav',{data:'data-v="Projects"',cls:'secondary'}));
  return pageHead('Planning','Tasks, milestones and dependencies ' + phase2) + list.map(p=>{
    const ts = p.tasks;
    const starts = ts.map(t=>+new Date(t.start)), ends = ts.map(t=>+new Date(t.end));
    const min = Math.min(...starts), max = Math.max(...ends), span = Math.max(86400000, max-min);
    const pct = v => ((v-min)/span*100).toFixed(2);
    const done = ts.filter(t=>t.done).length;
    return `<section class="panel"><div class="sec-head"><div><h2 class="sec">${esc(p.name)}</h2><div class="muted"><span class="num">${esc(p.order||'SO-'+p.id)}</span> · ${esc(p.deliveryOwner||'Marcus Lee')} · ${done}/${ts.length} complete</div></div>
      <div class="actions">${btn('Open project','open',{cls:'quiet sm',data:`data-id="${p.id}"`})}${btn('Add task or milestone','addTask',{cls:'secondary sm',data:`data-id="${p.id}"`,icon:'plus'})}</div></div>
      ${ts.length ? `<div class="rows">${ts.map(t=>{ const dep = t.dep ? ts.find(x=>String(x.id)===String(t.dep)) : null; return `<div class="row">
        <input type="checkbox" id="task-${t.id}" data-change="task" data-pid="${p.id}" data-tid="${t.id}" ${t.done?'checked':''} style="width:18px;height:18px;accent-color:var(--accent)">
        <label for="task-${t.id}" class="grow"><h3>${esc(t.name)}</h3><div class="muted">${esc(t.owner)} · ${t.milestone?'Milestone':'Task'}${dep?' · Depends on '+esc(dep.name):''}</div></label>
        <span class="num">${fmtDate(t.start)} → ${fmtDate(t.end)}</span>${t.done?'<span class="pill good">Complete</span>':'<span class="pill">Planned</span>'}
        <button type="button" class="iconbtn" data-act="delTask" data-pid="${p.id}" data-tid="${t.id}" aria-label="Remove ${esc(t.name)}">${ic('x')}</button></div>`; }).join('')}</div>
        <h3 class="label">Timeline</h3><div class="gantt">${ts.map(t=>{ const s=+new Date(t.start), e=+new Date(t.end);
          return `<div class="g-row"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t.name)}</span><div class="g-track">${t.milestone?`<i class="g-ms" style="left:${pct(e)}%"></i>`:`<i class="g-bar ${t.done?'done':''}" style="left:${pct(s)}%;width:${Math.max(1,(e-s)/span*100).toFixed(2)}%"></i>`}</div></div>`; }).join('')}
          <div class="g-scale"><span>${fmtDate(new Date(min).toISOString().slice(0,10))}</span><span>${fmtDate(new Date(max).toISOString().slice(0,10))}</span></div></div>`
        : `<p class="muted">No tasks yet. Add the first delivery task to start the plan.</p>`}</section>`;
  }).join('');
}

const TABS = ['Overview','Quote','Approvals','Documents','Signing','Handover','Activity'];
const locked = p => p.stage>=2;

function nextStep(p){
  return p.stage===0 ? 'Review the requirements and prepare the first quote.'
    : p.stage===1 ? (p.rejection ? `Changes were requested: “${p.rejection}”. Update the quote and resubmit.` : 'Complete pricing and submit for technical review.')
    : p.stage===2 ? `${p.approval} approval is needed before the quote can be shared.`
    : p.stage===3 ? (!hasApprovedDoc(p) ? 'Generate the approved customer document, then send it for signature.' : !p.signed ? 'Collect the customer’s signature.' : !p.counter ? 'Countersign to complete the envelope.' : 'Create the sales order and hand over to delivery.')

}

function tApprovals(p){
  const row = (kind, i) => {
    const owner = kind==='Technical' ? techOwner() : commOwner();

    const active = p.stage===2 && p.approval===kind;
    const may = U.role==='Administrator' || U.role===kind+' approver';
    const status = approved ? 'Approved' : active ? 'Awaiting decision' : 'Pending';
    return `<div class="appr"><span class="mark ${approved?'ok':active?'now':''}">${ic(approved?'ok':'check')}</span>
      <div><h3 style="font-size:15px;font-weight:600">${kind} approval</h3><div class="muted">${esc(owner)} · ${status}</div>${active&&!may?`<div class="hint">Switch the preview role to ${kind} approver or Administrator to decide.</div>`:''}</div>
      ${active?`<div class="actions">${btn('Approve','approve',{disabled:!may,data:`data-k="${kind}"`,icon:'ok'})}${btn('Request changes','rejectAsk',{cls:'secondary',disabled:!may,data:`data-k="${kind}"`})}</div>`:`<span class="pill ${approved?'good':''}">${status}</span>`}</div>`;
  };
  return `<div><h2 class="sec">Approval routing</h2><p class="muted" style="margin-top:4px">Each decision applies to revision ${p.rev} only. Requesting changes returns the quote to its author as a new revision.</p></div>

}

};

  catItem(d, form){ const p = cur(); const c = S.catalogue.find(x=>x.area===U.area && x.name===form.dataset.name); const q = Math.max(1, Math.round(+d.qty||1));
    p.lines.push({name:c.name, qty:q, cost:c.cost, basePrice:c.price, price:bracket(c.price,q)}); log('Catalogue item added','',`${q} × ${c.name}`,p.id); persist(); closeModal(); renderMain(); toast(`${q} × ${c.name} added`); },
  custom(d){ const p = cur(); p.lines.push({name:d.name.trim(), qty:Math.max(1,Math.round(+d.qty||1)), cost:+d.cost||0, price:+d.price||0}); log('Custom line added','',d.name,p.id); persist(); closeModal(); renderMain(); toast('Custom line added'); },
  product(d){ if(S.catalogue.some(c=>c.area===U.area && c.name.toLowerCase()===d.name.trim().toLowerCase())){ toast('A product with that name already exists'); return; }
    S.catalogue.push({name:d.name.trim(), brand:d.brand.trim(), category:d.category.trim(), cost:+d.cost||0, price:+d.price||0, area:U.area}); log('Product added','',d.name,null); persist(); closeModal(); renderMain(); toast(d.name+' added to the catalogue'); },
  reject(d){ const p = cur(); const k = U.modal.k; newRevision(p, 'Changes requested: '+d.reason.trim()); p.rejection = d.reason.trim(); log(`${k} review requested changes`, 'In approval', 'Revision '+p.rev+' · '+d.reason.trim(), p.id); persist(); U.modal=null; U.tab='Quote'; render(); toast('Returned to the author with your feedback'); },
  sign(d){ const p = cur(); update(p.id,{signed:true, signer:d.signer.trim(), signerTitle:(d.title||'').trim(), signedAt:stamp()},'Customer signature recorded'); U.modal=null; render(); toast('Customer signature recorded. Countersign to finish.'); },
  tender(d){ const sup = d.suppliers.split(',').map(s=>s.trim()).filter(Boolean); if(sup.length<2){ toast('Invite at least two suppliers for a fair tender'); return; }
    S.tenders.push({id:uid(), name:d.name.trim(), deadline:d.deadline, suppliers:[...new Set(sup)], status:'Open', bids:{}, area:U.area}); log('Tender created','',d.name,null); persist(); closeModal(); renderMain(); toast('Tender created and invitations simulated'); },
  bid(d, form){ const t = S.tenders.find(x=>x.id===U.modal.id); const s = form.dataset.s; t.bids[s] = +d.amount; log('Sealed bid submitted','',s,null); persist(); renderModal(); renderMain(); toast('Sealed response saved for '+s); },
  task(d){ const p = S.projects.find(x=>x.id===U.modal.id); if(d.end < d.start){ toast('The end date must be on or after the start date'); return; }
    p.tasks.push({id:uid(), name:d.name.trim(), owner:d.owner, start:d.start, end:d.end, dep:d.dep||'', milestone:!!d.milestone, done:false}); log('Delivery task added','',d.name,p.id); persist(); closeModal(); renderMain(); toast('Added to the plan'); },
  user(d){ if(S.users.some(u=>u.email.toLowerCase()===d.email.toLowerCase())){ toast('A user with that email already exists'); return; }
    S.users.push({name:d.name.trim(), email:d.email.trim(), role:d.role}); log('User added','',d.name,null); persist(); closeModal(); renderMain(); toast(d.name+' added. No invitation email is sent in the demo.'); },
  area(d){ const n = d.name.trim(); if(S.areas.some(a=>a.toLowerCase()===n.toLowerCase())){ toast('That business area already exists'); return; }
    S.areas.push(n); U.area = n; log('Business area created','',n,null); persist(); U.modal=null; render(); toast(n+' created'); },
  presentation(d){ const s = areaSet(); Object.assign(s, {template:d.template, theme:d.theme, contact:d.contact, footer:d.footer}); if(U.pendingLogo){ s.logo = U.pendingLogo; U.pendingLogo=null; }
    log('Document presentation saved','',d.template,null); if(!store.set(S)) toast('Saved for this session. The browser refused to store it.'); else toast('Presentation saved. New documents use it.'); renderMain(); },
  sso(d){ areaSet().sso = d; log('SSO configuration preview saved','',d.prov,null); persist(); toast('Configuration saved for review. No identity provider is connected.'); },
  handover(d){ const p = cur(); update(p.id,{deliveryOwner:d.deliveryOwner, handover:d.handover},'Handover details updated'); toast('Handover saved'); renderMain(); }
};

/* ---------- Wiring ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el || el.disabled) return;
  const fn = A[el.dataset.act]; if(fn){ e.preventDefault(); fn(el.dataset, el); }
});
document.addEventListener('change', e => { const el = e.target.closest('[data-change]'); if(el && C[el.dataset.change]) C[el.dataset.change](el); });
document.addEventListener('submit', e => { const form = e.target.closest('form[data-form]'); if(!form) return; e.preventDefault();
  const fd = new FormData(form); const d = Object.fromEntries(fd); const fn = F[form.dataset.form]; if(fn) fn(d, form); });
document.addEventListener('input', e => { if(e.target.id==='q'){ U.q = e.target.value; if(U.pid){ U.pid=null; } if(!['Projects','Catalogue','My work','Approvals','Planning','Reports'].includes(U.view)) U.view='Projects'; renderMain(); renderShell(); } });
document.addEventListener('keydown', e => { if(e.key==='Escape'){ if(U.modal) closeModal(); else if(U.nav){ U.nav=false; renderShell(); } } });
document.addEventListener('mousedown', e => { if(e.target.id==='modal') closeModal(); });

render();
})();

</script>
